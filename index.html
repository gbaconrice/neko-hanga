<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぴったり印刷所</title>
<script src="https://cdn.gravity.place/fe/sdk/index-1.0.2.min.js"></script>
<style>
:root{--top:0px;--bg:#243c3a;--paper:#f5efde;--ink:#f5efde;--accent:#e6a198;--sub:#b5c4b9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(var(--top) + 8px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
button{font-family:inherit;color:inherit}
.big{appearance:none;-webkit-appearance:none;border:0;border-radius:14px;height:54px;flex:none;font-size:20px;font-weight:800;
  letter-spacing:.2em;color:#23262d;background:var(--ink);box-shadow:0 4px 0 #b9b09a}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b9b09a}
.sub{appearance:none;-webkit-appearance:none;border:2px solid #4a505d;border-radius:14px;height:46px;flex:none;font-size:15px;
  font-weight:700;background:transparent;color:var(--ink)}
.sub:active{background:#333843}

/* title */
#title{align-items:center;justify-content:center;gap:14px;text-align:center}
#hero{width:160px;height:160px;background:var(--paper);box-shadow:0 8px 22px rgba(0,0,0,.5);transform:rotate(-4deg)}
#hero canvas,.th canvas{display:block;width:100%;height:100%}
h1{margin:6px 0 0;font-size:30px;letter-spacing:.08em}
#who{font-size:13px;color:var(--sub);min-height:18px}
.how{font-size:13px;line-height:1.8;color:#cfd3dc;margin:0;padding:0;list-style:none}
.how b{color:#ffd23f}
#title .big{width:100%;max-width:300px}

/* game */
.hud{display:flex;align-items:center;justify-content:space-between;height:46px;flex:none}
.lives{font-size:18px;letter-spacing:5px;color:var(--accent);min-width:80px}
.lives s{color:#4a505d;text-decoration:none}
.count{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.count b{font-size:27px;font-variant-numeric:tabular-nums}
#sub{font-size:11px;font-weight:700;color:#ffd23f}
.ib{appearance:none;-webkit-appearance:none;border:2px solid #4a505d;background:transparent;border-radius:10px;width:88px;height:38px;font-size:13px;font-weight:700}
.ib.off{color:#6b7280;text-decoration:line-through}
.bar{height:8px;border-radius:4px;background:#3a3f4a;overflow:hidden;margin:4px 0 6px;flex:none;position:relative}
.bar::before,.bar::after{content:'';position:absolute;top:0;bottom:0;width:2px;background:#23262d;z-index:1}
.bar::before{left:50%}
.bar::after{left:70%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff5d73);transform-origin:left center}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
.paper{background:var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.45);border-radius:2px}
.paper canvas{display:block;width:100%;height:100%}
.paper.pout{animation:pout .34s ease-in forwards}
.paper.pin{animation:pin .24s ease-out}
.paper.pshake{animation:pshake .3s}
@keyframes pout{to{transform:translateX(120%) rotate(8deg);opacity:0}}
@keyframes pin{from{transform:translateY(-28px);opacity:0}}
@keyframes pshake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);padding:8px 18px;border-radius:8px;
  font-size:20px;line-height:1.35;text-align:center;font-weight:900;letter-spacing:.08em;white-space:pre;pointer-events:none;opacity:0;border:3px solid currentColor;background:rgba(246,240,225,.92)}
#toast.ok{color:#1f8a5a}
#toast.ng{color:#d7263d}
#toast.sp{color:#a06a00}
#toast.show{animation:tst .8s ease-out}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(1.5)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}75%{opacity:1}100%{opacity:0}}
.knobs,.knobs *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.knobs{display:grid;gap:6px 4px;padding:8px 0;flex:none;justify-items:center}
.kn{display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none;cursor:grab;padding:2px 6px}
.dial{width:var(--d);height:var(--d);border-radius:50%;position:relative;border:4px solid var(--c);
  background:radial-gradient(circle at 35% 30%,#6a707d,#2b2f37 72%);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 0 0 5px #23262d;outline:2px solid rgba(243,236,220,.5);outline-offset:1px}
.dial.ease{transition:transform .14s cubic-bezier(.3,1.6,.6,1)}
.dial i{position:absolute;left:50%;top:6px;width:5px;height:26%;margin-left:-2.5px;border-radius:3px;background:var(--ink)}
.dial u{position:absolute;left:50%;top:50%;width:26%;height:26%;margin:-13% 0 0 -13%;border-radius:50%;background:#23262d;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.tags{display:flex;gap:3px;height:20px}
.tag{width:22px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.tag svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pt{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5px;border-radius:50%;pointer-events:none;animation:pt .65s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.paper.pstamp{animation:pstamp .18s ease-out}
@keyframes pstamp{35%{transform:scale(.94)}75%{transform:scale(1.05)}}
#sc.pop{animation:scpop .3s ease-out}
@keyframes scpop{40%{transform:scale(1.25);color:#ffd23f}}
.tagline{font-size:12px;letter-spacing:.3em;color:var(--sub);margin-top:-8px}

/* session results */
.head{text-align:center;flex:none;padding:6px 0 10px}
.head .lbl{font-size:13px;color:var(--sub);letter-spacing:.2em}
.head .num{font-size:56px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.head .num small{font-size:18px;margin-left:4px}
.head h2{margin:4px 0 0;font-size:20px;letter-spacing:.1em}
.rank{font-size:15px;font-weight:800;color:#ffd23f;margin-top:2px;min-height:20px}
#hint{height:20px;flex:none;text-align:center;font-size:12px;font-weight:700;color:#ffd23f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:54px;font-size:12px;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hp b{font-size:15px}
.hp.off{opacity:.35}
.kn.fix .dial{box-shadow:0 0 0 4px #ffd23f}
.grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;
  grid-template-columns:repeat(4,1fr);gap:8px;align-content:start;padding:4px 2px 12px}
.th{background:var(--paper);aspect-ratio:1/1;box-shadow:0 2px 6px rgba(0,0,0,.4);position:relative}
.th.q{background:#333843;display:flex;align-items:center;justify-content:center;color:#59606e;font-size:26px;font-weight:900;box-shadow:none}
.cell{display:flex;flex-direction:column;gap:3px}
.cell span{font-size:10px;color:var(--sub);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
.row{display:flex;gap:10px;flex:none}
.row>*{flex:1}
#loadStatus{font-size:12px;color:var(--sub);min-height:16px}
#printLabel{text-align:center;font-size:12px;letter-spacing:.03em;min-height:22px;color:#e9c97a;flex:none}
.big:disabled{opacity:.5;box-shadow:none;transform:none}
#toast{top:auto;bottom:0;font-size:13px;padding:6px 12px;line-height:1.3;max-width:95%;white-space:pre-line;transform:translateX(-50%);border-width:1px}
#toast.show{animation:printNotice 1.5s ease-out}
@keyframes printNotice{0%{opacity:0;transform:translate(-50%,8px)}15%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
@media(max-height:690px){#title{gap:8px}#hero{width:116px;height:116px}.how{font-size:12px}h1{font-size:26px}.knobs{padding:4px 0;gap:3px}.kn{gap:2px;padding:0 2px}.dial{width:min(var(--d),58px);height:min(var(--d),58px)}#printLabel{min-height:18px;font-size:11px}}
</style>
</head>
<body>
<div id="app">

  <div id="title" class="screen on">
    <div id="hero"></div>
    <h1>ぴったり印刷所</h1>
    <div class="tagline">ねこと、三色の小さな物語</div>
    <div id="who"></div>
    <div id="loadStatus" role="status">絵の具を用意しています…</div>
    <ul class="how">
      <li><b>つまみを回して</b>版のズレを直す</li>
      <li>四すみの<b>トンボ（＋印）</b>が重なれば「刷る」</li>
      <li><b>早く刷るほど高得点</b>。連続成功で倍率アップ</li>
      <li>ミス・時間切れでライフ−1、5枚連続で1つ回復</li>
      <li><b>注文</b>をこなすとボーナスと「おたすけ」</li>
    </ul>
    <button class="big" id="bStart" disabled>準備中…</button>

  </div>

  <div id="game" class="screen">
    <div class="hud">
      <div class="lives" id="lives"></div>
      <div class="count"><b id="sc">0</b><span id="sub"></span></div>
      <button class="ib" id="mute">音 ON</button>
    </div>
    <div class="bar"><i id="tbar"></i></div>
    <div id="hint"></div>
    <div id="printLabel">三色の版合わせ</div>
    <div class="stage" id="stage">
      <div class="paper" id="paper"><canvas id="cv"></canvas></div>
      <div id="toast"></div>
    </div>
    <div class="knobs" id="knobs"></div>
    <div class="row"><button class="sub hp" id="bHelp">おたすけ<b id="hpN">×1</b></button><button class="big" id="bPrint" style="flex:2.4">刷る</button></div>
  </div>

  <div id="over" class="screen">
    <div class="head">
      <div class="lbl">本日の成績</div>
      <div class="num"><span id="oNum">0</span><small>点</small></div>
      <div class="rank" id="oRank"></div>
      <div class="lbl" id="oSub" style="letter-spacing:.05em"></div>
    </div>
    <div class="grid" id="oGrid"></div>
    <div class="row">
      <button class="sub" id="bHome">タイトル</button>
      <button class="big" id="bRetry">もう一度</button>
    </div>
  </div>


</div>
<script>
(function(){'use strict';
/* ================= 調整用の設定 ================= */
var LIVES=3;            // ライフ数
var STEP=30;            // つまみ1目盛りの回転角(度)
var VMAX=12;            // つまみの可動範囲(±目盛り)
var SDK_TIMEOUT=4000;   // SDK応答の待機上限(ms)
var HEAL_EVERY=5;       // 何枚連続成功でライフ回復するか
var RARE_ONE_IN=7;      // 特色刷りが出る割合(1/N)
// 得点: (基本 + 段階×TIER_PT + 残り時間の割合×TIME_PT) × 連続倍率 + 特色・注文のボーナス
var BASE_PT=100,TIER_PT=20,TIME_PT=100,MULT_STEP=.1,MULT_MAX=2,SP_PT=200,ORDER_PT=300;
var HELP_START=1,HELP_MAX=3; // おたすけ(1か所を自動で合わせる)の初期数と上限
// 注文: 達成で ORDER_PT 点と、おたすけ+1
var ORD=[
{k:'fast',n:3,t:'時間を半分以上残して刷る'},
{k:'vfast',n:2,t:'時間を7割以上残して刷る'},
{k:'streak',n:4,t:'ミスなしで続けて刷る'},
{k:'sp',n:1,t:'★特色刷りを刷る'}
];
// GRAVITY上部UIの回避余白(暫定値。実機で要確認)。URLに ?top=数値 で上書き可
function topInset(){
  var q=null;try{q=new URLSearchParams(location.search).get('top')}catch(e){}
  if(q!==null&&q!==''&&!isNaN(+q))return +q;
  var embedded=false;try{embedded=window.parent!==window}catch(e){embedded=true}
  if(!embedded)return 0;
  return window.innerHeight>=812?98:74;
}
// 難易度: n=これまでに刷れた枚数
function cfg(n){
  if(n<3) return {tier:0,mov:1,rot:0,scl:0,links:0,u:2.6,range:4,time:40};
  if(n<7) return {tier:1,mov:2,rot:0,scl:0,links:0,u:2.2,range:4,time:45};
  if(n<12)return {tier:2,mov:2,rot:1,scl:0,links:0,u:1.9,range:5,time:45};
  if(n<18)return {tier:3,mov:2,rot:2,scl:0,links:1,u:1.6,range:5,time:42};
  if(n<25)return {tier:4,mov:2,rot:1,scl:1,links:2,u:1.5,range:5,time:42};
  return {tier:5,mov:2,rot:1,scl:1,links:Math.min(5,3+((n-25)/6|0)),u:Math.max(1,1.5-(n-25)*.03),range:6,time:Math.max(24,40-(n-25)*.8)};
}
// 称号(刷れた枚数)

var meowBuffer=null,meowLoading=null,activeMeows=[];
function loadMeows(){
  var a=au();if(!a||meowBuffer)return Promise.resolve();if(meowLoading)return meowLoading;
  meowLoading=fetch(CAT_AUDIO).then(function(r){return r.arrayBuffer()}).then(function(b){return a.decodeAudioData(b)}).then(function(buf){meowBuffer=buf;meowLoading=null}).catch(function(){meowLoading=null});
  return meowLoading;
}
function stopMeows(){
  activeMeows.slice().forEach(function(src){try{src.stop()}catch(e){}});activeMeows=[];
}
function meow(){
  var a=au();if(!a)return;
  if(!meowBuffer){loadMeows();return}
  try{
    var src=a.createBufferSource(),g=a.createGain();src.buffer=meowBuffer;
    src.playbackRate.value=1;g.gain.value=.55;src.connect(g);g.connect(a.destination);
    activeMeows.push(src);src.onended=function(){var i=activeMeows.indexOf(src);if(i>=0)activeMeows.splice(i,1);src.disconnect();g.disconnect()};
    src.start(a.currentTime+.09);
  }catch(e){}
}

function sRare(){[660,880,1100,1320].forEach(function(f,i){setTimeout(function(){beep(f,.16,'triangle',.08)},i*80)})}
function sHeal(){setTimeout(function(){beep(990,.25,'sine',.09,1480)},260)}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(70)}catch(e){}}
function sNg(){beep(170,.28,'sawtooth',.06,85)}

/* ================= ゲーム本体 ================= */
var cv=$('cv'),ctx=cv.getContext('2d'),paper=$('paper');
var plates=[],cur=null,prints=0,lives=LIVES,works=[],bag=[],tLeft=0,tMax=1,running=false,busy=false,dials=[],sent=false,streak=0,told={},score=0,maxStreak=0,spGot=0,order=null,ordDone=0,helps=0,hintOn=false,revealing=false;

function fit(){
  var r=$('stage').getBoundingClientRect();
  var s=Math.max(120,Math.floor(Math.min(r.width,r.height)-6));
  var d=Math.min(2,window.devicePixelRatio||1),px=Math.round(s*d);
  paper.style.width=paper.style.height=s+'px';
  if(cv.width!==px){cv.width=cv.height=px;return true}
  return false;
}
function offs(){
  return cur.ax.map(function(_,i){var s=0;for(var j=0;j<cur.v.length;j++)s+=cur.M[i][j]*(cur.v[j]-cur.sol[j]);return s});
}
function tfs(){
  var o=offs(),t=[0,1,2].map(function(){return {x:0,y:0,r:0,s:0}});
  cur.ax.forEach(function(a,i){t[a.p][a.t]+=o[i]*(a.t==='r'?cur.u*1.3:a.t==='s'?cur.u*.022:cur.u)});
  return t;
}
function draw(){if(cur)compose(ctx,cv.width,plates,revealing?null:tfs(),cur.va,!revealing)}
function hud(){
  var h='';for(var i=0;i<LIVES;i++)h+=i<lives?'●':'<s>●</s>';
  $('lives').innerHTML=h;if(score!==scShown){if(score>scShown)scoreTo(score);else{clearInterval(scTimer);scShown=score;$('sc').textContent=score}}
  var m=Math.min(MULT_MAX,1+MULT_STEP*streak);
  $('sub').textContent=prints+'枚'+(streak>=1?' ・ 次 ×'+m.toFixed(1):'');
  $('hpN').textContent='×'+helps;$('bHelp').classList.toggle('off',helps<=0);
}
var ICON={
  x:'<svg viewBox="0 0 16 16"><path d="M2 8h12M5 5L2 8l3 3M11 5l3 3-3 3"/></svg>',
  y:'<svg viewBox="0 0 16 16"><path d="M8 2v12M5 5l3-3 3 3M5 11l3 3 3-3"/></svg>',
  r:'<svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M12 1.5v3.2H8.8"/></svg>',
  s:'<svg viewBox="0 0 16 16"><path d="M3 13L13 3M8.5 3H13v4.5M7.5 13H3V8.5"/></svg>'
};
var HINTS={start:'つまみを回して、四すみの＋印を重ねよう',two:'動く版が2枚に。色でつまみを見分けよう',r:'版を回転させるつまみが登場',link:'色の札が2つあるつまみは、2か所が同時に動く',s:'版の大きさを変えるつまみが登場'};
function hintFor(c){
  var k=prints===0?'start':null;
  if(!k&&c.scl&&!told.s)k='s';
  if(!k&&c.links&&!told.link)k='link';
  if(!k&&c.rot&&!told.r)k='r';
  if(!k&&c.mov>1&&!told.two)k='two';
  if(k)told[k]=1;
  hintOn=!!k;$('hint').textContent=k?HINTS[k]:orderText();
}
function newOrder(){
  var pool=ORD.filter(function(o){return !order||o.k!==order.k}),o=pool[rnd(pool.length)];
  order={k:o.k,n:o.n,t:o.t,p:0};
}
function orderText(){return order?'注文：'+order.t+' '+order.p+'/'+order.n:''}
function orderStep(frac,va){
  if(!order)return false;var k=order.k;
  if((k==='fast'&&frac>=.5)||(k==='vfast'&&frac>=.7)||k==='streak'||(k==='sp'&&va.sp))order.p++;
  if(order.p<order.n)return false;
  ordDone++;helps=Math.min(HELP_MAX,helps+1);newOrder();return true;
}
function orderMiss(){if(order&&order.k==='streak')order.p=0;if(!hintOn)$('hint').textContent=orderText()}
function useHelp(){
  if(!running||busy||!cur||helps<=0)return;au();
  var c=[];cur.v.forEach(function(v,j){if(v!==cur.sol[j])c.push(j)});
  if(!c.length)return;
  var j=c[rnd(c.length)],cell=dials[j].parentNode;
  helps--;cur.v[j]=cur.sol[j];dials[j].classList.add('ease');snap(j);
  cell.classList.add('fix');setTimeout(function(){cell.classList.remove('fix')},700);
  beep(700,.15,'sine',.08,1050);draw();hud();
}
function buildKnobs(){
  var box=$('knobs'),n=cur.ax.length;box.innerHTML='';dials=[];
  box.style.gridTemplateColumns='repeat('+(n<=4?n:3)+',1fr)';
  var d=n<=2?100:(n<=4?74:72);
  for(var j=0;j<n;j++){(function(j){
    var cell=document.createElement('div');cell.className='kn';
    cell.style.setProperty('--c',cur.cols[cur.ax[j].p]);cell.style.setProperty('--d',d+'px');
    var idx=[j];for(var i=0;i<n;i++)if(i!==j&&cur.M[i][j])idx.push(i);
    var tags=idx.map(function(i){var c=cur.cols[cur.ax[i].p];return '<span class="tag" style="background:'+c+';color:'+fgFor(c)+'">'+ICON[cur.ax[i].t]+'</span>'}).join('');
    cell.innerHTML='<div class="dial"><i></i><u></u></div><div class="tags">'+tags+'</div>';
    box.appendChild(cell);dials[j]=cell.firstChild;bindKnob(cell,j);
  })(j)}
}
function snap(j){dials[j].style.transform='rotate('+(cur.v[j]*STEP)+'deg)'}
function setV(j,n){
  n=Math.max(-VMAX,Math.min(VMAX,n));if(n===cur.v[j])return false;
  cur.v[j]=n;sTick();draw();return true;
}
// つまみ: 指で回す(右回り=＋)。回さずに左右をタップしても1目盛り動く
function bindKnob(cell,j){
  var st=null,dial=cell.firstChild;
  function ok(){return running&&!busy&&cur&&cell.isConnected}
  cell.addEventListener('pointerdown',function(e){
    if(!ok())return;e.preventDefault();try{cell.setPointerCapture(e.pointerId)}catch(_){}
    au();var r=dial.getBoundingClientRect();
    st={cx:r.left+r.width/2,cy:r.top+r.height/2,a:null,acc:0,base:cur.v[j],moved:false};
    dial.classList.remove('ease');
  });
  cell.addEventListener('pointermove',function(e){
    if(!st)return;if(!ok()){st=null;return}
    var dx=e.clientX-st.cx,dy=e.clientY-st.cy;
    if(dx*dx+dy*dy<144){st.a=null;return}
    var a=Math.atan2(dy,dx)*180/Math.PI;
    if(st.a===null){st.a=a;return}
    var d=a-st.a;if(d>180)d-=360;if(d<-180)d+=360;st.a=a;st.acc+=d;
    var lim=VMAX*STEP+12;st.acc=Math.max(-lim-st.base*STEP,Math.min(lim-st.base*STEP,st.acc));
    if(Math.abs(st.acc)>7)st.moved=true;
    setV(j,st.base+Math.round(st.acc/STEP));
    dial.style.transform='rotate('+(st.base*STEP+st.acc)+'deg)';
  });
  function up(e){
    if(!st)return;
    if(ok()){
      if(!st.moved&&e.type==='pointerup')setV(j,cur.v[j]+(e.clientX<st.cx?-1:1));
      dial.classList.add('ease');snap(j);
    }
    st=null;
  }
  cell.addEventListener('pointerup',up);
  cell.addEventListener('pointercancel',up);
}
function newSheet(){
  revealing=false;
  $('printLabel').textContent='三色の版合わせ · 仕上がりは刷ってから';
  var c=cfg(prints);
  if(!bag.length){bag=[];for(var i=0;i<W.length;i++)bag.push(i);shuffle(bag)}
  if(!order&&prints>=3)newOrder();
  var va=variant(bag.pop(),prints,order&&order.k==='sp'&&rnd(3)===0?1+rnd(SP.length):undefined);
  var mov=shuffle([0,1,2]).slice(0,c.mov),ax=[];
  mov.forEach(function(p,k){ax.push({p:p,t:'x'},{p:p,t:'y'});if(k<c.rot)ax.push({p:p,t:'r'});if(k>=c.mov-c.scl)ax.push({p:p,t:'s'})});
  var n=ax.length,M=ax.map(function(_,i){return ax.map(function(_,j){return i===j?1:0})});
  var L=c.links,guard=0;
  while(L>0&&guard++<60){var j=1+rnd(n-1),i2=rnd(j);if(!M[i2][j]){M[i2][j]=Math.random()<.5?1:-1;L--}}
  var sol=ax.map(function(){return (1+rnd(c.range))*(Math.random()<.5?1:-1)});
  cur={va:va,cols:cols(va),ax:ax,M:M,sol:sol,v:ax.map(function(){return 0}),u:c.u,tier:c.tier};
  hintFor(c);buildKnobs();fit();plates=makePlates(va,cv.width,true);
  tMax=tLeft=c.time;$('tbar').style.transform='scaleX(1)';draw();
}
function toast(msg,cls){
  var t=$('toast');t.textContent=msg;t.className=cls;void t.offsetWidth;t.className=cls+' show';
}
function anim(cls,ms,cb){
  paper.classList.remove('pout','pin','pshake');void paper.offsetWidth;paper.classList.add(cls);
  setTimeout(function(){paper.classList.remove(cls);if(cb)cb()},ms);
}
function burst(cs){
  var st=$('stage');
  for(var i=0;i<18;i++){
    var p=document.createElement('i'),a=Math.random()*6.2832,d=70+Math.random()*90;
    p.className='pt';p.style.background=cs[i%cs.length];
    p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');
    st.appendChild(p);(function(p){setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},700)})(p);
  }
}
var scShown=0,scTimer=null;
function scoreTo(n){
  var el=$('sc'),from=scShown,t0=Date.now();clearInterval(scTimer);
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  scTimer=setInterval(function(){
    var k=Math.min(1,(Date.now()-t0)/320);scShown=Math.round(from+(n-from)*k);el.textContent=scShown;
    if(k>=1)clearInterval(scTimer);
  },30);
}
function nextSheet(){
  busy=true;
  function slide(){anim('pout',340,function(){
    if(!running)return;
    newSheet();anim('pin',240);busy=false;
  })}
  if(revealing)anim('pstamp',180,function(){setTimeout(slide,1350)});
  else slide();
}

function onPrint(){
  if(!running||busy||!artReady)return;au();
  var ok=offs().every(function(o){return o===0});
  if(ok){
    var va=cur.va,name='「'+W[va.mi].n+'」',heal=false,frac=Math.max(0,Math.min(1,tLeft/tMax));
    prints++;streak++;if(streak>maxStreak)maxStreak=streak;works.push(va);if(va.sp)spGot++;
    var mult=Math.min(MULT_MAX,1+MULT_STEP*(streak-1));
    var pts=Math.round((BASE_PT+cur.tier*TIER_PT+Math.round(TIME_PT*frac))*mult)+(va.sp?SP_PT:0);
    var od=orderStep(frac,va);if(od)pts+=ORDER_PT;
    score+=pts;
    if(streak%HEAL_EVERY===0&&lives<LIVES){lives++;heal=true}
    hud();
    revealing=true;plates=makePlates(va,cv.width,false);draw();
    $('printLabel').textContent=(va.sp?'★ '+SP[va.sp-1].n+' · ':'')+W[va.mi].n;
    burst(cur.cols);sPress();meow();
    toast((va.sp?'★ '+SP[va.sp-1].n+'\n':'')+name+'\n+'+pts+(od?'\n注文達成！おたすけ+1':'')+(heal?'\nライフ回復！':''),va.sp?'sp':'ok');
    if(va.sp||od)setTimeout(sRare,350);
    if(heal)sHeal();
    nextSheet();
  }else{
    lives--;streak=0;orderMiss();hud();sNg();buzz();toast('ズレてる！','ng');
    busy=true;
    anim('pshake',320,function(){if(lives<=0)gameOver();else busy=false});
  }
}
function onTimeout(){
  lives--;streak=0;orderMiss();hud();sNg();buzz();toast('時間切れ','ng');
  if(lives<=0){busy=true;setTimeout(gameOver,500)}else nextSheet();
}
function sendScore(score){
  // GRAVITY標準ランキングへの通知(1プレイ1回)。受理・表示は実機で確認すること
  if(sent)return;sent=true;
  try{window.parent.postMessage({type:'gameOver',score:score},'*')}catch(e){}
}
function gameOver(){
  running=false;busy=false;sendScore(score);
  $('oSub').textContent=prints+'枚 ・ 最高連続 '+maxStreak+' ・ 特色 '+spGot+' ・ 注文 '+ordDone;
  $('oNum').textContent=score;$('oRank').textContent='称号：'+rank(prints);
  var g=$('oGrid');g.innerHTML='';
  if(!works.length)g.innerHTML='<div class="empty">まだ1枚も刷れていません。<br>トンボ（＋印）をよく見て合わせよう</div>';
  works.forEach(function(w){var c=document.createElement('div');c.className='cell';var t=document.createElement('div');t.className='th';t.appendChild(thumb(w,84));c.appendChild(t);var s=document.createElement('span');s.textContent=(w.sp?'★':'')+W[w.mi].n;c.appendChild(s);g.appendChild(c)});
  show('over');
}
function start(){
  if(!artReady){loadArt();return}
  au();loadMeows();prints=0;lives=LIVES;streak=0;score=0;maxStreak=0;spGot=0;order=null;ordDone=0;helps=HELP_START;works=[];bag=[];told={};sent=false;running=true;busy=false;revealing=false;cur=null;
  show('game');hud();newSheet();anim('pin',240);
}
function home(){
  running=false;show('title');
  if(!artReady)return;
  var h=$('hero');h.innerHTML='';h.appendChild(thumb(plain(0),160));
}

/* ================= ループ・イベント ================= */
var last=0;
function loop(ts){
  var dt=Math.min(.1,(ts-last)/1000||0);last=ts;
  if(running&&!busy&&cur){
    tLeft-=dt;$('tbar').style.transform='scaleX('+Math.max(0,tLeft/tMax)+')';
    if(tLeft<=0)onTimeout();
  }
  requestAnimationFrame(loop);
}
// 埋め込みWebViewでも連打による拡大を防ぐため、CSSの指定に加えて対策する。
// つまみはPointer Eventsで操作するため、互換タッチイベントの既定動作だけ止める。
// 他のボタンのclickや結果一覧のスクロールには触れない。
function preventKnobZoom(e){if(e.cancelable)e.preventDefault()}
$('knobs').addEventListener('touchstart',preventKnobZoom,{passive:false});
$('knobs').addEventListener('touchend',preventKnobZoom,{passive:false});
$('bStart').addEventListener('click',start);
$('bRetry').addEventListener('click',start);
$('bHome').addEventListener('click',home);
$('bPrint').addEventListener('click',onPrint);
$('bHelp').addEventListener('click',useHelp);
$('mute').addEventListener('click',function(){
  muted=!muted;this.textContent=muted?'音 OFF':'音 ON';this.classList.toggle('off',muted);if(muted)stopMeows();else{sTick();loadMeows()}
});
window.addEventListener('resize',function(){
  document.documentElement.style.setProperty('--top',topInset()+'px');
  if(running&&cur){if(fit())plates=makePlates(cur.va,cv.width,!revealing);draw()}
});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ================= GRAVITY SDK(無くても遊べる) ================= */
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function loadUser(){
  try{
    var s=window.AgentSDK;if(!s||!s.user||typeof s.user.getMyUserInfo!=='function')return;
    withTimeout(Promise.resolve(s.user.getMyUserInfo()),SDK_TIMEOUT).then(function(r){
      var d=(r&&r.data)||r||{},n=d.name||d.user_name;
      if(n)$('who').textContent='刷り師：'+n;
    }).catch(function(){});
  }catch(e){}
}

document.documentElement.style.setProperty('--top',topInset()+'px');
home();loadArt();loadUser();requestAnimationFrame(loop);
// 動作確認用(?debug=1 のときだけ有効)
try{if(new URLSearchParams(location.search).get('debug'))window.__pz={thumb:thumb,plain:plain,variant:variant,W:W,cur:function(){return cur},state:function(){return {prints:prints,lives:lives,running:running,busy:busy,streak:streak,meows:meowBuffer?1:0,artReady:artReady,revealing:revealing,score:score,helps:helps,order:order,ordDone:ordDone}},setLives:function(n){lives=n},setPrints:function(n){prints=n}}}catch(e){}
})();
</script>
